<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7f8">
  <title>DART Grid Atlas</title>
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="preconnect" href="https://basemaps.cartocdn.com">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <style>
    :root {
      color-scheme: light;
      --ink: #172635;
      --muted: #71808e;
      --surface: rgba(255, 255, 255, .94);
      --surface-strong: #fff;
      --surface-border: rgba(26, 47, 64, .1);
      --shadow: 0 12px 36px rgba(34, 52, 65, .12);
      --accent: #147d78;
      --accent-soft: #e4f5f2;
      --map-region: #668087;
      --grid-line: #167a92;
      --station: #238aa1;
      --plant: #e49a39;
      --canvas: #edf2f2;
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --ink: #e8eff3;
      --muted: #9babb7;
      --surface: rgba(20, 31, 40, .94);
      --surface-strong: #192630;
      --surface-border: rgba(208, 227, 236, .12);
      --shadow: 0 14px 40px rgba(0, 0, 0, .3);
      --accent: #69d3c4;
      --accent-soft: rgba(68, 173, 159, .16);
      --map-region: #a4c4c6;
      --grid-line: #65cfdf;
      --station: #79d8ec;
      --plant: #ffc370;
      --canvas: #10191f;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--canvas);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button { font: inherit; }

    .topbar {
      position: relative;
      z-index: 1000;
      display: grid;
      grid-template-columns: minmax(190px, 1fr) auto minmax(190px, 1fr);
      align-items: center;
      min-height: 76px;
      padding: 0 30px;
      background: var(--surface-strong);
      border-bottom: 1px solid var(--surface-border);
      box-shadow: 0 2px 14px rgba(28, 48, 62, .05);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      color: var(--ink);
      text-decoration: none;
    }

    .brand-mark {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      color: #fff;
      background: linear-gradient(145deg, #178d83, #246b82);
      border-radius: 12px;
      box-shadow: 0 5px 13px rgba(25, 122, 119, .23);
    }

    .brand-mark svg { width: 21px; height: 21px; }
    .brand-copy { display: grid; gap: 2px; }
    .brand-name { font-size: 15px; font-weight: 750; letter-spacing: -.025em; }
    .brand-subtitle { color: var(--muted); font-size: 9px; font-weight: 750; letter-spacing: .13em; }

    .mode-switch {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px;
      background: var(--canvas);
      border: 1px solid var(--surface-border);
      border-radius: 13px;
    }

    .mode-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 38px;
      padding: 0 17px;
      color: var(--muted);
      background: transparent;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 680;
      transition: color .18s ease, background .18s ease, box-shadow .18s ease;
      white-space: nowrap;
    }

    .mode-button svg { width: 16px; height: 16px; }
    .mode-button:hover { color: var(--ink); }
    .mode-button[aria-pressed="true"] {
      color: var(--ink);
      background: var(--surface-strong);
      box-shadow: 0 2px 7px rgba(25, 42, 54, .1);
    }
    .mode-button[aria-pressed="true"] svg { color: var(--accent); }

    .topbar-actions { display: flex; justify-content: flex-end; }
    .theme-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 39px;
      padding: 0 13px;
      color: var(--ink);
      background: var(--surface-strong);
      border: 1px solid var(--surface-border);
      border-radius: 11px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 650;
      transition: border-color .18s ease, transform .18s ease;
    }
    .theme-button:hover { border-color: var(--accent); transform: translateY(-1px); }
    .theme-button svg { width: 16px; height: 16px; color: var(--accent); }

    main {
      position: absolute;
      inset: 76px 0 0;
    }

    #map {
      position: absolute;
      inset: 0;
      background: var(--canvas);
    }

    .legend {
      position: absolute;
      z-index: 500;
      right: 24px;
      bottom: 25px;
      width: 220px;
      padding: 15px 16px 14px;
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 15px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
    }

    .legend-title {
      margin: 0 0 12px;
      font-size: 10px;
      font-weight: 780;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .legend-items { display: grid; gap: 9px; }
    .legend-row {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 550;
    }

    .legend-dot {
      width: 9px;
      height: 9px;
      flex: 0 0 auto;
      background: var(--legend-color);
      border: 2px solid var(--surface-strong);
      border-radius: 50%;
      box-shadow: 0 0 0 1px var(--legend-color);
    }

    .legend-line {
      width: 17px;
      height: 3px;
      flex: 0 0 auto;
      background: var(--legend-color);
      border-radius: 5px;
    }

    .map-footnote {
      position: absolute;
      z-index: 500;
      bottom: 28px;
      left: 28px;
      padding: 8px 11px;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 10px;
      box-shadow: 0 5px 17px rgba(34, 52, 65, .08);
      font-size: 9px;
      pointer-events: none;
    }

    .map-error {
      position: absolute;
      z-index: 600;
      top: 24px;
      left: 28px;
      display: none;
      max-width: min(390px, calc(100vw - 56px));
      padding: 11px 14px;
      color: #9a3030;
      background: #fff0ef;
      border: 1px solid rgba(180, 51, 51, .2);
      border-radius: 11px;
      box-shadow: var(--shadow);
      font-size: 11px;
      line-height: 1.45;
    }
    html[data-theme="dark"] .map-error { color: #ffc2bd; background: #3a2427; }
    .map-error.visible { display: block; }

    .leaflet-container { font-family: inherit; }
    .leaflet-control-attribution {
      padding: 2px 6px !important;
      color: #5e6d76 !important;
      background: rgba(255, 255, 255, .8) !important;
      border-radius: 5px 0 0 0;
      font-size: 9px !important;
    }
    .leaflet-control-attribution a { color: #246f75 !important; }
    .leaflet-bar {
      overflow: hidden;
      border: 1px solid var(--surface-border) !important;
      border-radius: 10px !important;
      box-shadow: var(--shadow) !important;
    }
    .leaflet-bar a, .leaflet-bar a:hover {
      width: 34px !important;
      height: 34px !important;
      color: var(--ink) !important;
      background: var(--surface-strong) !important;
      border-bottom: 1px solid var(--surface-border) !important;
      line-height: 32px !important;
    }
    .leaflet-bar a:last-child { border-bottom: 0 !important; }
    .leaflet-control-scale-line {
      color: var(--muted) !important;
      background: var(--surface) !important;
      border-color: var(--muted) !important;
      font-size: 9px !important;
    }
    .leaflet-popup-content-wrapper, .leaflet-popup-tip {
      color: var(--ink);
      background: var(--surface-strong);
      box-shadow: var(--shadow);
    }
    .leaflet-popup-content-wrapper { border-radius: 12px; }
    .leaflet-popup-content { margin: 13px 15px; }
    .leaflet-popup-close-button { color: var(--muted) !important; }

    .map-popup { min-width: 175px; }
    .popup-title { margin: 0 20px 2px 0; font-size: 12px; font-weight: 760; }
    .popup-subtitle { margin: 0 0 10px; color: var(--muted); font-size: 10px; }
    .popup-row {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      padding: 5px 0;
      border-top: 1px solid var(--surface-border);
      font-size: 10px;
    }
    .popup-label { color: var(--muted); }
    .popup-value { max-width: 145px; color: var(--ink); font-weight: 620; text-align: right; }

    .facility-marker {
      display: grid !important;
      place-items: center;
      background: transparent;
      border: 0;
    }
    .facility-marker span {
      display: block;
      width: 9px;
      height: 9px;
      background: var(--marker-color);
      border: 1.5px solid #fff;
      border-radius: 50%;
      box-shadow: 0 1px 5px rgba(0, 0, 0, .32);
    }
    .station-marker span {
      width: 7px;
      height: 7px;
      border-radius: 2px;
      transform: rotate(45deg);
    }

    .map-cluster {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      color: #fff;
      background: color-mix(in srgb, var(--cluster-color) 85%, transparent);
      border: 2px solid rgba(255, 255, 255, .9);
      border-radius: 50%;
      box-shadow: 0 2px 10px rgba(24, 45, 59, .25);
      font-size: 10px;
      font-weight: 750;
    }
    .map-cluster.large { width: 44px; height: 44px; font-size: 11px; }

    @media (max-width: 760px) {
      .topbar {
        grid-template-columns: auto 1fr auto;
        gap: 10px;
        min-height: 66px;
        padding: 0 12px;
      }
      .brand { gap: 8px; }
      .brand-mark { width: 34px; height: 34px; border-radius: 10px; }
      .brand-subtitle { display: none; }
      .brand-name { font-size: 13px; }
      .mode-switch { justify-self: center; }
      .mode-button { min-height: 34px; gap: 5px; padding: 0 9px; font-size: 10px; }
      .mode-button svg { width: 14px; height: 14px; }
      .theme-button { width: 38px; min-height: 38px; padding: 0; }
      .theme-button span { display: none; }
      main { inset-block-start: 66px; }
      .map-error { top: 14px; left: 12px; max-width: calc(100vw - 24px); }
      .legend { right: 12px; bottom: 22px; width: 184px; padding: 12px; }
      .map-footnote { bottom: 22px; left: 12px; max-width: calc(100vw - 220px); font-size: 8px; }
      .leaflet-bottom.leaflet-right { bottom: 174px; }
    }

    @media (max-width: 420px) {
      .topbar { grid-template-columns: 1fr auto; }
      .brand { display: none; }
      .mode-switch { justify-self: start; }
      .mode-button { padding: 0 8px; }
      .legend { width: 165px; }
      .map-footnote { max-width: calc(100vw - 195px); }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" aria-label="DART Grid Atlas home">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M13.2 2.8 5.7 13h5.1l-.5 8.2L18.3 11h-5.2l.1-8.2Z" fill="currentColor"/>
        </svg>
      </span>
      <span class="brand-copy">
        <span class="brand-name">DART Grid Atlas</span>
        <span class="brand-subtitle">U.S. POWER SYSTEMS</span>
      </span>
    </a>

    <nav class="mode-switch" aria-label="Map layers">
      <button class="mode-button" id="plants-button" type="button" aria-pressed="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path d="M4 20h16M6 20V9l5 3V8l7 3v9M9 16h1m4 0h1m-5-3h1m4 0h1"/>
        </svg>
        <span>Power Plants Map</span>
      </button>
      <button class="mode-button" id="network-button" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <circle cx="5" cy="6" r="2"/><circle cx="19" cy="7" r="2"/><circle cx="12" cy="18" r="2"/>
          <path d="m7 7 4 9m6-8-4 8M7 6.4l10-.1"/>
        </svg>
        <span>Infrastructure Map</span>
      </button>
    </nav>

    <div class="topbar-actions">
      <button class="theme-button" id="theme-button" type="button" aria-label="Switch to dark theme">
        <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path d="M20.2 15.1A8.3 8.3 0 0 1 8.9 3.8 8.5 8.5 0 1 0 20.2 15.1Z"/>
        </svg>
        <span id="theme-label">Dark theme</span>
      </button>
    </div>
  </header>

  <main>
    <div id="map" role="application" aria-label="Interactive map of U.S. power infrastructure"></div>
    <div class="map-error" id="map-error" role="alert"></div>
    <aside class="legend" aria-label="Map legend">
      <h2 class="legend-title" id="legend-title">Power plants</h2>
      <div class="legend-items" id="legend-items"></div>
    </aside>
    <div class="map-footnote">U.S. infrastructure data · Regional boundaries shown for context</div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script>
    const map = L.map("map", {
      zoomControl: false,
      preferCanvas: true,
      minZoom: 2,
      maxZoom: 18
    }).setView([39, -98], 4.1);

    L.control.zoom({ position: "bottomright" }).addTo(map);
    L.control.scale({ imperial: true, metric: false, position: "bottomleft" }).addTo(map);
    map.createPane("regions");
    map.getPane("regions").style.zIndex = 330;
    map.createPane("transmission");
    map.getPane("transmission").style.zIndex = 410;

    let activeMode = "plants";
    let activeTheme = localStorage.getItem("dart-map-theme") === "dark" ? "dark" : "light";
    let regionLayer = null;
    let plantGroup = null;
    let stationGroup = null;
    let transmissionLayer = null;
    let lineController = null;
    let lineRequestId = 0;
    let modeRequestId = 0;
    let networkReady = false;
    let moveTimer = null;
    const cachedData = new Map();
    let tileLayer = null;

    const ui = {
      plantsButton: document.getElementById("plants-button"),
      networkButton: document.getElementById("network-button"),
      themeButton: document.getElementById("theme-button"),
      themeIcon: document.getElementById("theme-icon"),
      themeLabel: document.getElementById("theme-label"),
      error: document.getElementById("map-error"),
      legendTitle: document.getElementById("legend-title"),
      legendItems: document.getElementById("legend-items")
    };

    function setTheme(theme) {
      activeTheme = theme;
      document.documentElement.dataset.theme = theme;
      localStorage.setItem("dart-map-theme", theme);
      ui.themeLabel.textContent = theme === "dark" ? "Light theme" : "Dark theme";
      ui.themeButton.setAttribute(
        "aria-label",
        theme === "dark" ? "Switch to light theme" : "Switch to dark theme"
      );
      ui.themeIcon.innerHTML = theme === "dark"
        ? '<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/>'
        : '<path d="M20.2 15.1A8.3 8.3 0 0 1 8.9 3.8 8.5 8.5 0 1 0 20.2 15.1Z"/>';
      if (tileLayer) map.removeLayer(tileLayer);
      map.getPane("tilePane").style.filter = theme === "dark"
        ? "invert(1) hue-rotate(180deg) brightness(.82) contrast(.92) saturate(.72)"
        : "brightness(1.15) contrast(0.95) saturate(0.4)";
      tileLayer = L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
          subdomains: "abc",
          maxZoom: 20,
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }
      ).addTo(map);
      if (regionLayer) regionLayer.setStyle(regionStyle());
    }

    function regionStyle() {
      return {
        color: getComputedStyle(document.documentElement).getPropertyValue("--map-region").trim(),
        weight: 1,
        opacity: activeTheme === "dark" ? 0.42 : 0.38,
        fill: false,
        interactive: false
      };
    }

    function showError(error) {
      ui.error.textContent = `Unable to load map data: ${error.message || error}`;
      ui.error.classList.add("visible");
      console.error("DART map data error:", error);
    }

    function hideError() {
      ui.error.classList.remove("visible");
      ui.error.textContent = "";
    }

    function setModeButtonState(mode) {
      ui.plantsButton.setAttribute("aria-pressed", String(mode === "plants"));
      ui.networkButton.setAttribute("aria-pressed", String(mode === "network"));
    }

    function setLegend(mode) {
      if (mode === "plants") {
        ui.legendTitle.textContent = "Generation mix";
        ui.legendItems.innerHTML = [
          ["Wind", "#43b985"], ["Solar", "#e7ae4c"], ["Hydro", "#45b7c8"],
          ["Nuclear", "#9d82db"], ["Natural gas", "#5289d7"], ["Other fuels", "#eb785c"]
        ].map(([label, color]) => `<div class="legend-row"><span class="legend-dot" style="--legend-color:${color}"></span>${label}</div>`).join("");
      } else {
        ui.legendTitle.textContent = "Transmission Lines";
        ui.legendItems.innerHTML = [
          ["765 / 500 kV", "#df6581"], ["345 kV", "#986fce"], ["230 kV", "#348eb3"],
          ["115 kV and below", "#68a78d"]
        ].map(([label, color]) => `<div class="legend-row"><span class="legend-line" style="--legend-color:${color}"></span>${label}</div>`).join("");
      }
    }

    function getCachedData(key, url) {
      if (!cachedData.has(key)) {
        const request = fetch(url).then(response => {
          if (!response.ok) throw new Error(`${response.status} ${response.statusText} (${url})`);
          return response.json();
        }).catch(error => {
          cachedData.delete(key);
          throw error;
        });
        cachedData.set(key, request);
      }
      return cachedData.get(key);
    }

    function popupElement(title, subtitle, rows) {
      const root = document.createElement("div");
      root.className = "map-popup";
      const heading = document.createElement("h3");
      heading.className = "popup-title";
      heading.textContent = title || "Unnamed asset";
      root.appendChild(heading);
      if (subtitle) {
        const subheading = document.createElement("p");
        subheading.className = "popup-subtitle";
        subheading.textContent = subtitle;
        root.appendChild(subheading);
      }
      for (const [label, rawValue] of rows) {
        if (rawValue === null || rawValue === undefined || rawValue === "") continue;
        const row = document.createElement("div");
        row.className = "popup-row";
        const key = document.createElement("span");
        key.className = "popup-label";
        key.textContent = label;
        const value = document.createElement("span");
        value.className = "popup-value";
        value.textContent = String(rawValue);
        row.append(key, value);
        root.appendChild(row);
      }
      return root;
    }

    function createClusterIcon(cluster, color) {
      const count = cluster.getChildCount();
      const size = count >= 1000 ? "large" : "";
      return L.divIcon({
        html: `<span class="map-cluster ${size}" style="--cluster-color:${color}">${count.toLocaleString()}</span>`,
        className: "",
        iconSize: [count >= 1000 ? 48 : 42, count >= 1000 ? 48 : 42]
      });
    }

    function makeMarkerGroup(color) {
      return L.markerClusterGroup({
        chunkedLoading: true,
        chunkInterval: 100,
        chunkDelay: 20,
        maxClusterRadius: 42,
        showCoverageOnHover: false,
        spiderfyOnMaxZoom: true,
        disableClusteringAtZoom: 12,
        iconCreateFunction: cluster => createClusterIcon(cluster, color)
      });
    }

    function plantColor(fuel) {
      const value = String(fuel || "").toUpperCase();
      if (value.includes("WND") || value.includes("WIND")) return "#43b985";
      if (value.includes("SUN") || value.includes("SOLAR")) return "#e7ae4c";
      if (value.includes("WAT") || value.includes("HYDRO")) return "#45b7c8";
      if (value.includes("NUC")) return "#9d82db";
      if (value.includes("NG") || value.includes("GAS")) return "#5289d7";
      return "#eb785c";
    }

    function createPlantGroup(collection) {
      const group = makeMarkerGroup("#d8923e");
      const markers = collection.features.map(feature => {
        const properties = feature.properties || {};
        const color = plantColor(properties.primary_fuel);
        const icon = L.divIcon({
          className: "facility-marker",
          html: `<span style="--marker-color:${color}"></span>`,
          iconSize: [12, 12],
          iconAnchor: [6, 6]
        });
        const coordinates = feature.geometry.coordinates;
        const marker = L.marker([coordinates[1], coordinates[0]], {
          icon,
          title: properties.name || "Power plant",
          riseOnHover: true
        });
        marker.on("click", () => {
          marker.bindPopup(popupElement(
            properties.name,
            [properties.city, properties.state].filter(Boolean).join(", "),
            [
              ["Fuel", properties.primary_fuel],
              ["Type", properties.type],
              ["Status", properties.status],
              ["Summer capacity", properties.summer_capacity === null ? null : `${Number(properties.summer_capacity).toLocaleString()} MW`],
              ["Operator", properties.operator]
            ]
          )).openPopup();
        });
        return marker;
      });
      group.addLayers(markers);
      return group;
    }

    function stationColor(voltage) {
      const value = Number(voltage);
      if (value >= 500) return "#df6581";
      if (value >= 345) return "#986fce";
      if (value >= 230) return "#348eb3";
      return "#68a78d";
    }

    function createStationGroup(collection) {
      const group = L.featureGroup();
      collection.features.forEach(feature => {
        const properties = feature.properties || {};
        const color = stationColor(properties.max_voltage);
        const icon = L.divIcon({
          className: "facility-marker",
          html: `<span style="--marker-color:${color}"></span>`,
          iconSize: [9, 9],
          iconAnchor: [4.5, 4.5]
        });
        const coordinates = feature.geometry.coordinates;
        const marker = L.marker([coordinates[1], coordinates[0]], {
          icon,
          title: properties.name || "Substation",
          riseOnHover: true
        });
        marker.on("click", () => {
          marker.bindPopup(popupElement(
            properties.name || "Substation",
            null,
            [
              ["Voltage", properties.max_voltage ? `${properties.max_voltage} kV` : null],
              ["Type", properties.type],
              ["Status", properties.status]
            ]
          )).openPopup();
        });
        group.addLayer(marker);
      });
      return group;
    }

    function lineColor(voltage) {
      const value = Number(voltage);
      if (value >= 500) return "#df6581";
      if (value >= 345) return "#986fce";
      if (value >= 230) return "#348eb3";
      return "#68a78d";
    }

    function makeLineLayer(collection) {
      return L.geoJSON(collection, {
        pane: "transmission",
        style: feature => ({
          color: lineColor(feature.properties && feature.properties.voltage),
          weight: map.getZoom() < 5 ? 1.15 : 1.7,
          opacity: activeTheme === "dark" ? 0.82 : 0.76,
          lineCap: "round",
          lineJoin: "round"
        }),
        onEachFeature: (feature, layer) => {
          layer.on("click", () => {
            const properties = feature.properties || {};
            layer.bindPopup(popupElement(
              properties.line_id ? `Transmission line ${properties.line_id}` : "Transmission line",
              properties.voltage_class || properties.type,
              [
                ["Voltage", properties.voltage ? `${properties.voltage} kV` : null],
                ["Status", properties.status],
                ["Owner", properties.owner],
                ["From", properties.from_substation],
                ["To", properties.to_substation]
              ]
            )).openPopup();
          });
        }
      });
    }

    function updateNetworkLines() {
      if (map.getZoom() < 2.5) {
        if (transmissionLayer) {
          map.removeLayer(transmissionLayer);
          transmissionLayer = null;
        }
        return Promise.resolve();
      }
      
      // Load transmission lines GeoJSON directly - simpler and faster
      return getCachedData("transmission-all", "/data/transmission_lines.geojson").then(collection => {
        if (activeMode !== "network" || !networkReady) return;
        
        if (transmissionLayer) map.removeLayer(transmissionLayer);
        transmissionLayer = makeLineLayer(collection).addTo(map);
      }).catch(error => {
        if (activeMode === "network") showError(error);
      });
    }

    async function switchMode(mode) {
      if (mode === activeMode && (mode === "plants" ? plantGroup : networkReady)) return;
      activeMode = mode;
      const requestId = ++modeRequestId;
      setModeButtonState(mode);
      setLegend(mode);
      hideError();

      if (plantGroup) map.removeLayer(plantGroup);
      if (stationGroup) {
        map.removeLayer(stationGroup);
        stationGroup = null;
      }
      if (transmissionLayer) {
        map.removeLayer(transmissionLayer);
        transmissionLayer = null;
      }
      if (lineController) lineController.abort();

      try {
        if (mode === "plants") {
          const collection = await getCachedData("plants", "/api/power-plants");
          if (requestId !== modeRequestId) return;
          if (!plantGroup) plantGroup = createPlantGroup(collection);
          plantGroup.addTo(map);
        } else {
          // TODO: Skip substations loading for now - too slow (79,000+ records)
          // Uncomment when we have better rendering performance (canvas layers, clustering, etc)
          // const [stations] = await Promise.all([
          //   getCachedData("substations", "/api/substations")
          // ]);
          // if (requestId !== modeRequestId) return;
          // if (!stationGroup) stationGroup = createStationGroup(stations);
          
          if (requestId !== modeRequestId) return;
          networkReady = true;
          await updateNetworkLines();
        }
      } catch (error) {
        if (requestId === modeRequestId) showError(error);
      }
    }

    function loadRegions() {
      getCachedData("regions", "/api/iso-regions").then(collection => {
        if (!regionLayer) {
          regionLayer = L.geoJSON(collection, {
            pane: "regions",
            renderer: L.canvas(),
            style: regionStyle,
            interactive: false,
            smoothFactor: 1.5
          }).addTo(map);
        }
      }).catch(showError);
    }

    ui.plantsButton.addEventListener("click", () => switchMode("plants"));
    ui.networkButton.addEventListener("click", () => switchMode("network"));
    ui.themeButton.addEventListener("click", () => setTheme(activeTheme === "dark" ? "light" : "dark"));
    map.on("moveend", () => {
      if (activeMode !== "network" || !networkReady) return;
      window.clearTimeout(moveTimer);
      moveTimer = window.setTimeout(() => {
        updateNetworkLines().catch(showError);
      }, 300);
    });
    // TODO: Re-enable when substation rendering performance is improved
    // map.on("zoomend", () => {
    //   if (activeMode !== "network" || !networkReady || !stationGroup) return;
    //   if (map.getZoom() >= 9) {
    //     if (!map.hasLayer(stationGroup)) {
    //       map.addLayer(stationGroup);
    //     }
    //   } else {
    //     if (map.hasLayer(stationGroup)) {
    //       map.removeLayer(stationGroup);
    //     }
    //   }
    // });

    setTheme(activeTheme);
    setLegend("plants");
    loadRegions();
    switchMode("plants");
  </script>
</body>
</html>
